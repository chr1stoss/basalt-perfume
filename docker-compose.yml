services:
  db:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: basalt_parfume
      MYSQL_USER: basalt
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-basalt_local_change_me}
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-local_root_change_me}
    ports:
      - "${LOCAL_DB_PORT:-3307}:3306"
    volumes:
      - basalt_db_data:/var/lib/mysql
      - ./bot/database/seeds/02_full_demo.sql:/docker-entrypoint-initdb.d/001-full-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: basalt_parfume
      MYSQL_USER: basalt
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-basalt_local_change_me}
      DATA_DIR: /app/bot/data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./bot/data:/app/bot/data
    restart: unless-stopped

volumes:
  basalt_db_data:
