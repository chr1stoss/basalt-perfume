name: Web CI

on:
  push:
    branches: ["web"]
  pull_request:
    branches: ["web"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP syntax (8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql, mbstring
          coverage: none
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find public_html -type f -name '*.php' -print0)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do php -l "$file"; done

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript
        run: |
          node --check public_html/assets/app.js
          node --check public_html/assets/js/core/api.js
          node --check public_html/telegram-web-app.js
          node --input-type=module --check < public_html/telegram-oidc-relay/worker.js

  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest --cov=parser_engine --cov-report=term-missing
      - name: Compile Python files
        run: python -m compileall -q private/basalt-site-worker public_html/scripts

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
