name: Pre-commit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Для PR чекаутим head-ветку, чтобы можно было пушить фиксы обратно в неё
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        # continue-on-error, чтобы job не падал до шага авто-коммита
        continue-on-error: true
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Auto-commit fixes
        # Только для PR из этого же репозитория (форки не пушим)
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix pre-commit issues"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          # Исключаем workflow-файлы: GITHUB_TOKEN не имеет права их менять
          file_pattern: |
            *
            !.github/workflows/

      - name: Fail if pre-commit found issues (non-PR or fork PR)
        # Для push в main и для форков — просто валим job, если есть проблемы
        if: >
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name != github.repository
        run: pre-commit run --show-diff-on-failure --color=always --all-files